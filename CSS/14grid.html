<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GRID</title>
    <style>
      
      .conatiner{
          display: grid;
          grid-template-columns: minmax(10px,1fr) minmax(10px,1fr) minmax(10px,1fr);
          grid-template-rows: 600px 300px 600px ;
          


         /* justify-items: center; work on x axis 
           row-gap: 10px ; and column */
          

      }
      .box{
       /*height: 100px;
        width: 100px; */
         margin: 1px;
      }
      .box1{
         background-color: darkblue;
       /*  align-self: end;  its for y axis
       justify-self: center;    its for x axis */
       grid-column-start:1 ;
        grid-column-end: 3;
         
      }
      .box2{
        background-color: forestgreen;
       
      }
      .box3{
        background-color: grey;
      }

    </style>
</head>
<body>

    <div class="conatiner">
        <div class="box box1"></div>
        <div class="box box2"></div>
        <div class="box box3"></div>
        <div class="box box1"></div>
        <div class="box box2"></div>
        <div class="box box3"></div>
        <div class="box box1"></div>
        <div class="box box2"></div>
        <div class="box box3"></div>
       
    </div>
    
</body>
</html>
