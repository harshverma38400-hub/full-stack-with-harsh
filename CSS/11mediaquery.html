<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mediaquery11</title>
    <link rel="stylesheet" href="./mediaquery11.css">
    <style>
     .conatiner{
        display: flex;

     }

     .box{
        height: 300px;
        width: 300px;
        margin: 10px;
        border: 5px solid black;
     }
     .box1{
        background-color: burlywood;
     }
     .box2{
        background-color: blueviolet;
     }
     .box3{
        background-color: darkcyan;
     }

     @media screen and  (min-width:400px)  {
        .conatiner{
            display:flex;
            justify-content: center;
            height: 300px;
         align-items: center; 

        }
        .box{
            height: 100px;
            width: 100px;
            border-radius: 50px;


        }

     }

    </style>
</head>
<body>
    <div class="conatiner">
        <div class="box box1"></div>
        <div class="box box2"></div>
        <div class="box box3"></div>
    </div>
    
</body>
</html>
