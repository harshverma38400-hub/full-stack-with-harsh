<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tarnsition</title>
    <style>

        img{ 
            border: 10px solid black;
            height: 100px;
            width: 100px;
             transition:  height 3s, width 3s;
             transition-delay: 2s;
        }
        img:hover{
            height: 300px;
            width: 300px;
        }
       
        
        div{
            background-color: black;
            height: 100px;
            width: 100px;
            transition: height 3s, width 3s;
            transition-timing-function:ease-in ;
            transition-delay: 4s;
        }

        div:hover{
            height: 300px;
            width: 300px;
        }
    </style>
</head>
<body>
    <div></div>
    <p title="kese ho">hello</p>
    <abbr title="wassyup">wy</abbr>
   <img src="../photo.jpg" alt="">
    
</body>
</html>
